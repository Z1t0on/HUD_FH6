<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HUD FH6 — Telemetry</title>
    <link rel="icon" href="assets/HUD.ico" />

    <!-- Une feuille par tuile : l'ordre des liens fixe la cascade. -->
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/topbar.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/panels.css" />
    <link rel="stylesheet" href="styles/tiles/lap.css" />
    <link rel="stylesheet" href="styles/tiles/cluster.css" />
    <link rel="stylesheet" href="styles/tiles/map.css" />
    <link rel="stylesheet" href="styles/tiles/tires.css" />
    <link rel="stylesheet" href="styles/tiles/pedals.css" />
    <link rel="stylesheet" href="styles/tiles/gforce.css" />
    <link rel="stylesheet" href="styles/tiles/inspector.css" />
    <link rel="stylesheet" href="styles/modals.css" />
    <link rel="stylesheet" href="styles/menus.css" />
    <link rel="stylesheet" href="styles/responsive.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/build/three.module.js",
          "three/addons/": "/vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">FH6</span>
          <div class="brand-text">
            <h1>Telemetry HUD</h1>
            <p>Forza Horizon 6 · Data Out</p>
          </div>
        </div>

        <!-- Sélecteur d'espace : les tuiles changent de page en étant déposées
             sur l'une des deux flèches. -->
        <div class="page-switch" id="page-switch" role="group" aria-label="Espace de travail">
          <button
            class="btn page-arrow"
            id="page-prev"
            type="button"
            data-page="1"
            aria-label="Espace précédent"
          >
            ‹
          </button>
          <span class="page-label" id="page-label">Espace 1 / 2</span>
          <button
            class="btn page-arrow"
            id="page-next"
            type="button"
            data-page="2"
            aria-label="Espace suivant"
          >
            ›
          </button>
        </div>

        <div class="topbar-status">
          <span class="conn" id="conn">
            <i class="conn-dot"></i>
            <span id="status" data-i18n="status.connecting">Connexion…</span>
          </span>
          <span class="chip" id="udp-info">UDP 9999</span>

          <button
            class="btn units-btn"
            id="units-toggle"
            type="button"
            aria-label="Système d'unités : métrique"
            title="Passer au système impérial (mph, °F, ft)"
          >
            KM/H · °C
          </button>

          <button class="btn lang-btn" id="lang-toggle" type="button">FR</button>

          <details class="menu" id="panels-menu">
            <summary class="btn" data-i18n="menu.panels">Panneaux</summary>
            <div class="menu-body" id="panels-menu-body"></div>
          </details>

          <details class="menu" id="theme-menu">
            <summary class="btn" data-i18n="menu.theme">Thème</summary>
            <div class="menu-body menu-theme" id="theme-menu-body">
              <div class="menu-row">
                <span class="menu-label" data-i18n="menu.preset">Ambiance</span>
                <div class="theme-presets" id="theme-presets"></div>
              </div>
              <label class="menu-row">
                <span class="menu-label" data-i18n="menu.accent">Accent</span>
                <input type="color" id="theme-accent" value="#00e5ff" />
              </label>
              <label class="menu-row">
                <span class="menu-label" data-i18n="menu.background">Fond</span>
                <input type="color" id="theme-bg" value="#05080d" />
              </label>
              <div class="menu-row">
                <span class="menu-label" data-i18n="menu.gauge">Compteur</span>
                <button class="btn btn-small" id="gauge-toggle" type="button" data-gauge="digital">
                  Digital
                </button>
              </div>
              <button class="btn btn-small menu-reset" id="theme-reset" type="button">
                <span data-i18n="menu.reset">Réinitialiser</span>
              </button>
            </div>
          </details>

          <button class="btn sessions-btn" id="sessions-open" type="button">
            Sessions <span class="sessions-count" id="sessions-count">0</span>
          </button>
          <button class="btn" id="fullscreen" type="button" data-i18n="app.fullscreen">
            Plein écran
          </button>
        </div>
      </header>

      <!-- Les tuiles sont créées par le script et réparties entre les espaces. -->
      <main class="layout" id="workspace"></main>
      <main class="layout" id="workspace-2" hidden></main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="hud.js"></script>
  </body>
</html>
